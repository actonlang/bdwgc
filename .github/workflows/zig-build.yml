---
# This workflow is for zig-based build/test running on Linux, MacOS, Windows.
name: zig build

"on": [push, pull_request]

jobs:
  build:
    name: >-
      ${{ matrix.os }} ${{ matrix.ttriple }} ${{ matrix.linkage }}
      thr:${{ matrix.threads }}
      rwlock:${{ matrix.rwlock }}
      redir:${{ matrix.redirect_malloc }}
      gcdeb:${{ matrix.gc_debug }}
      munmap:${{ matrix.munmap }}
      paramark:${{ matrix.parallel_mark }}
      thrlocal:${{ matrix.thread_local_alloc }}
      multi-obj:${{ matrix.disable_single_obj }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12

    strategy:
      fail-fast: false

      matrix:
        zig_version: ["0.17.0"]
        os: [macos-latest, ubuntu-latest, windows-latest]
        ttriple: [native, native-native-msvc, x86-windows-gnu]
        build_cord: [true]
        cplusplus: [true]
        disable_handle_fork: [false]
        disable_single_obj: [false, true]
        gc_assertions: [true]
        gc_debug: [false, true]
        large_config: [false]
        linkage: [static, dynamic]
        munmap: [false, true]
        parallel_mark: [false, true]
        redirect_malloc: [false, true]
        rwlock: [false, true]
        thread_local_alloc: [false, true]
        threads: [false, true]
        exclude:
          - os: macos-latest
            ttriple: native-native-msvc
          - os: macos-latest
            ttriple: x86-windows-gnu
          - os: ubuntu-latest
            ttriple: native-native-msvc
          - os: ubuntu-latest
            ttriple: x86-windows-gnu
          - os: windows-latest
            disable_handle_fork: true
          - disable_single_obj: true
            linkage: static
          - threads: false
            disable_handle_fork: true
          - threads: false
            parallel_mark: true
          - threads: false
            rwlock: true
          - threads: false
            thread_local_alloc: true
          # The following ones are long-running jobs, thus excluded.
          - os: macos-latest
            gc_debug: true
            rwlock: true
          # The following ones just to reduce amount of jobs.
          - disable_single_obj: true
            gc_debug: true
          - disable_single_obj: true
            munmap: false
          - disable_single_obj: true
            parallel_mark: false
          - disable_single_obj: true
            ttriple: native
          - linkage: dynamic
            munmap: false
          - linkage: static
            munmap: true
            threads: false
          - gc_debug: true
            rwlock: true
            thread_local_alloc: false
          - parallel_mark: false
            redirect_malloc: true
          - gc_debug: true
            thread_local_alloc: false
          - os: macos-latest
            munmap: false
            threads: false
          - os: macos-latest
            munmap: false
            rwlock: true
          - os: macos-latest
            rwlock: true
            thread_local_alloc: false
          - os: macos-latest
            parallel_mark: false
            rwlock: true
          - os: macos-latest
            munmap: false
            redirect_malloc: false
          - os: macos-latest
            redirect_malloc: false
            threads: true
            thread_local_alloc: false
          - os: macos-latest
            parallel_mark: false
            redirect_malloc: false
            threads: true
          - ttriple: x86-windows-gnu
            gc_debug: true
            munmap: false
          - ttriple: x86-windows-gnu
            munmap: false
            parallel_mark: false
          - ttriple: x86-windows-gnu
            redirect_malloc: true
            rwlock: false
            threads: true
          - ttriple: x86-windows-gnu
            rwlock: true
            parallel_mark: false

    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig_version }}

      - name: Build and run tests
        run: >
          zig build
          -Dtarget=${{ matrix.ttriple }}
          -Dlinkage=${{ matrix.linkage }}
          -Dbuild_cord=${{ matrix.build_cord }}
          -Ddisable_handle_fork=${{ matrix.disable_handle_fork }}
          -Ddisable_single_obj_compilation=${{ matrix.disable_single_obj }}
          -Denable_cplusplus=${{ matrix.cplusplus }}
          -Denable_gc_assertions=${{ matrix.gc_assertions }}
          -Denable_gc_debug=${{ matrix.gc_debug }}
          -Denable_large_config=${{ matrix.large_config }}
          -Denable_munmap=${{ matrix.munmap }}
          -Denable_parallel_mark=${{ matrix.parallel_mark }}
          -Denable_redirect_malloc=${{ matrix.redirect_malloc }}
          -Denable_rwlock=${{ matrix.rwlock }}
          -Denable_thread_local_alloc=${{ matrix.thread_local_alloc }}
          -Denable_threads=${{ matrix.threads }}
          -Denable_werror
          test

      - name: Print the collector logs of the tests
        # On Windows, the collector writes its messages, the abort message
        # among them, to <program>.gc.log next to the program instead of to
        # stdout and stderr. The checkout wrote build.zig; older logs came
        # with the restored Zig cache.
        if: failure() && runner.os == 'Windows'
        shell: bash
        run: >
          find .zig-cache/o -name '*.gc.log' -newer build.zig
          -printf '=== %p\n' -exec cat {} \;

  acton-options:
    name: >-
      ${{ matrix.os }} Acton options block_size:${{ matrix.block_size }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false

      matrix:
        zig_version: ["0.17.0"]
        os: [macos-latest, ubuntu-latest, windows-latest]
        block_size: [16384, 65536]

    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig_version }}

      - name: Build and run tests
        run: >
          zig build
          -Dblock_size=${{ matrix.block_size }}
          -Ddisable_realloc_free
          -Ddisable_thread_local_warmup
          -Denable_gc_assertions
          -Denable_mark_bits
          -Denable_mark_range_stealing
          -Denable_werror
          -Dinitial_mark_stack_size=1048576
          -Dtl_refill_max=16
          test

      - name: Check asynchronous userfaultfd write protection
        if: ${{ matrix.os == 'ubuntu-latest' }}
        # The runners have Linux 6.10 or later.  The cache directory of this
        # build holds one uffdwptest executable, unlike the shared Zig cache.
        # A system call which writes to a protected page succeeds in this mode.
        run: >
          zig build --cache-dir zig-cache-uffdwp
          -Dblock_size=${{ matrix.block_size }}
          -Ddisable_realloc_free
          -Ddisable_thread_local_warmup
          -Denable_gc_assertions
          -Denable_mark_bits
          -Denable_mark_range_stealing
          -Denable_werror
          -Dinitial_mark_stack_size=1048576
          -Dtl_refill_max=16
          test;
          GC_PRINT_STATS=1 "$(find zig-cache-uffdwp/o -name uffdwptest -type f)"
          > zig-uffdwp-async.log 2>&1;
          grep -F "Using asynchronous userfaultfd write protection"
          zig-uffdwp-async.log;
          grep -E " 0 of [0-9]+ system-call stores failed with EFAULT"
          zig-uffdwp-async.log

      - name: Build and run tests with synchronous userfaultfd write protection
        if: ${{ matrix.os == 'ubuntu-latest' }}
        # Otherwise the runners use the asynchronous mode.  A system call which
        # writes to a protected page fails in this mode.
        run: >
          set -o pipefail;
          zig build
          "-DCFLAGS_EXTRA=-DNO_UFFDWP_ASYNC"
          -Dblock_size=${{ matrix.block_size }}
          -Ddisable_realloc_free
          -Ddisable_thread_local_warmup
          -Denable_gc_assertions
          -Denable_large_config
          -Denable_mark_bits
          -Denable_mark_range_stealing
          -Denable_werror
          -Dinitial_mark_stack_size=1048576
          -Dlinkage=static
          -Dtiny_freelists=129
          -Dtl_refill_max=16
          test 2>&1 | tee zig-uffdwp-sync.log;
          grep -F "Using userfaultfd in write-protect mode" zig-uffdwp-sync.log;
          grep -E " [1-9][0-9]* of [0-9]+ system-call stores failed with EFAULT"
          zig-uffdwp-sync.log

      - name: Build and run tests with static linkage
        # Acton links the collector statically, compiled file by file, with
        # the large configuration and thread-local free lists for objects of
        # up to 2 KiB (128 granules).
        run: >
          zig build
          -Dblock_size=${{ matrix.block_size }}
          -Ddisable_realloc_free
          -Ddisable_thread_local_warmup
          -Denable_gc_assertions
          -Denable_large_config
          -Denable_mark_bits
          -Denable_mark_range_stealing
          -Denable_werror
          -Dinitial_mark_stack_size=1048576
          -Dlinkage=static
          -Dtiny_freelists=129
          -Dtl_refill_max=16
          test

      - name: Build and run tests with the prefetch on push turned off
        env:
          # Use one marker per MiB of the estimated mark work.
          GC_BYTES_PER_MARKER: "1M"
        run: >
          zig build
          "-DCFLAGS_EXTRA=-DGC_NO_PUSH_PREFETCH"
          -Dblock_size=${{ matrix.block_size }}
          -Ddisable_realloc_free
          -Ddisable_thread_local_warmup
          -Denable_gc_assertions
          -Denable_mark_bits
          -Denable_mark_range_stealing
          -Denable_werror
          -Dinitial_mark_stack_size=1048576
          -Dtl_refill_max=16
          test

      - name: Build and run tests with object padding turned off
        run: >
          zig build
          -Dblock_size=${{ matrix.block_size }}
          -Ddisable_realloc_free
          -Ddisable_thread_local_warmup
          -Denable_end_padding=false
          -Denable_gc_assertions
          -Denable_mark_bits
          -Denable_mark_range_stealing
          -Denable_werror
          -Dinitial_mark_stack_size=1048576
          -Dtl_refill_max=16
          test

      - name: Build and run tests with speedups turned off
        env:
          GC_BYTES_PER_MARKER: "1M"
        run: >
          zig build
          "-DCFLAGS_EXTRA=-DGC_ATTR_ALWAYS_INLINE= -DGC_NO_CANCEL_STATE_SKIP
          -DGC_NO_FREE_BLOCK_RUNS -DGC_NO_IDLE_MARKER_CV
          -DGC_NO_TL_MALLOC_FAST_PATH"
          -Dblock_size=${{ matrix.block_size }}
          -Ddisable_realloc_free
          -Ddisable_thread_local_warmup
          -Denable_gc_assertions
          -Denable_mark_bits
          -Denable_mark_range_stealing
          -Denable_werror
          -Dinitial_mark_stack_size=1048576
          -Dtl_refill_max=16
          test

      - name: Build and run tests with mark bytes
        # Acton can select mark bytes instead of mark bits. This step uses
        # the options of the static linkage step with mark bytes. It runs
        # last, so that its failure skips none of the steps with mark bits,
        # and not on Windows, to keep those jobs within their time limit.
        if: ${{ matrix.os != 'windows-latest' }}
        run: >
          zig build
          -Dblock_size=${{ matrix.block_size }}
          -Ddisable_realloc_free
          -Ddisable_thread_local_warmup
          -Denable_gc_assertions
          -Denable_large_config
          -Denable_mark_bits=false
          -Denable_mark_range_stealing
          -Denable_werror
          -Dinitial_mark_stack_size=1048576
          -Dlinkage=static
          -Dtiny_freelists=129
          -Dtl_refill_max=16
          test

      - name: Print the collector logs of the tests
        # See the same step of the build job.
        if: failure() && runner.os == 'Windows'
        shell: bash
        run: >
          find .zig-cache/o -name '*.gc.log' -newer build.zig
          -printf '=== %p\n' -exec cat {} \;
