---
# This workflow is for build/test using `Makefile.direct`.
name: make direct build

"on": [push, pull_request]

jobs:
  build:
    name: >-
      ${{ matrix.os }} ${{ matrix.c_compiler }} ${{ matrix.cflags_extra }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      # Deliver the feedback for all matrix combinations.
      fail-fast: false

      matrix:
        os: [macos-latest, ubuntu-24.04-arm, ubuntu-latest, windows-latest]
        c_compiler: [clang, gcc]
        cxx_compiler: [clang++, g++]
        cflags_extra:
          - -DGC_THREADS -DPARALLEL_MARK -DTHREAD_LOCAL_ALLOC
          - -O3 -Wall -Wextra -Werror
        exclude:
          - os: macos-latest
            c_compiler: gcc
          - c_compiler: clang
            cxx_compiler: g++
          - c_compiler: gcc
            cxx_compiler: clang++
        include:
          - os: windows-latest
            cflags_target: >-
              -D_CRT_SECURE_NO_DEPRECATE -DDONT_USE_USER32_DLL
              -Wno-deprecated-declarations -Wno-inline-new-delete
            curses_opt: CURSES="-lgdi32 -luser32"

    steps:
      - uses: actions/checkout@v6

      - name: Checkout libatomic_ops repository
        uses: actions/checkout@v6
        with:
          repository: bdwgc/libatomic_ops
          path: libatomic_ops

      - name: Build
        run: >
          make -j8 -f Makefile.direct
          CC=${{ matrix.c_compiler }}
          CXX=${{ matrix.cxx_compiler }}
          CFLAGS_EXTRA="${{ matrix.cflags_extra }}
          ${{ matrix.cflags_target }}"

      - name: Test
        run: >
          make -f Makefile.direct check cord/de
          CC=${{ matrix.c_compiler }}
          CXX=${{ matrix.cxx_compiler }}
          CFLAGS_EXTRA="${{ matrix.cflags_extra }}
          ${{ matrix.cflags_target }}"
          ${{ matrix.curses_opt }}

      - name: Test enforcing mprotect-based VDB
        shell: bash
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            rm -f gctest.gc.log
            start=$(date +%s)
            GC_PROMPT_DISABLED=1 GC_USE_GETWRITEWATCH=0 timeout 150 ./gctest
            rc=$?
            echo "run $i rc=$rc in $(( $(date +%s) - start )) s"
            if [ $rc -ne 0 ]; then
              echo "=== gctest.gc.log of run $i:"
              cat gctest.gc.log 2>/dev/null || echo "(no log file)"
              exit 1
            fi
          done
          echo "=== tail of the last gctest.gc.log:"
          tail -5 gctest.gc.log 2>/dev/null || true
